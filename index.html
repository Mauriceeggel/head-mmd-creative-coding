<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creative Coding</title>
<meta name="description" content="Small web experiments built by vibe coding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a black desktop; projects are icons in a column grid from the top left.
   A project with several versions is a folder that opens a small window listing them. */
:root{
  --bg:#000;
  --ink:#e9e9ee;
  --muted:#8a8a96;
  --select:#2b4fd8;
  --window:#141418;
  --line:#34343c;
  --accent:#e9b75a;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font-mono); font-size:13px; -webkit-user-select:none; user-select:none}

.desktop{list-style:none; margin:0; padding:24px 16px; height:100vh;
  display:grid; grid-auto-flow:column; grid-template-rows:repeat(auto-fill, 112px); grid-auto-columns:104px; gap:8px; align-content:start}
@media (max-width:560px){
  .desktop{height:auto; grid-auto-flow:row; grid-template-rows:none; grid-template-columns:repeat(auto-fill, 104px); justify-content:center}
}
.icon{display:flex; flex-direction:column; align-items:center; gap:6px; width:104px; padding:6px 4px;
  color:inherit; text-decoration:none; background:none; border:0; font:inherit; cursor:pointer}
.icon svg{width:56px; height:56px; padding:4px; border-radius:6px; box-sizing:content-box}
.icon .label{max-width:100%; padding:1px 5px; border-radius:3px; text-align:center; line-height:1.3; overflow-wrap:anywhere}
.icon:hover svg{background:rgba(255,255,255,.08)}
.icon:focus-visible{outline:none}
.icon:focus-visible svg, .icon.open svg{background:rgba(255,255,255,.14)}
.icon:focus-visible .label, .icon.open .label{background:var(--select); color:#fff}

/* Window */
.window{position:fixed; top:96px; left:min(160px, calc(100vw - 336px)); width:min(320px, calc(100vw - 32px));
  background:var(--window); border:1px solid var(--line); border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:hidden}
.window[hidden]{display:none}
@media (max-width:560px){ .window{left:16px} }
.titlebar{display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); cursor:grab; touch-action:none}
.titlebar:active{cursor:grabbing}
.close{width:14px; height:14px; padding:0; border-radius:50%; border:0; background:#ff5f57; cursor:pointer; flex:none}
.close:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.title{flex:1; text-align:center; color:var(--muted); margin-right:24px}
.versions{list-style:none; margin:0; padding:6px}
.versions a{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:baseline; padding:8px 10px; border-radius:4px; color:inherit; text-decoration:none}
.versions a:hover, .versions a:focus-visible{background:var(--select); color:#fff; outline:none}
.versions .v{color:var(--accent)}
.versions .date{color:var(--muted); font-variant-numeric:tabular-nums}
.versions a:hover .v, .versions a:focus-visible .v,
.versions a:hover .date, .versions a:focus-visible .date{color:#fff}
.count{padding:6px 12px 8px; border-top:1px solid var(--line); color:var(--muted); font-size:11px}
</style>
</head>
<body>
  <!--
    To add a project:
    1. Create a folder named YY-MM-DD-name with an index.html inside.
    2. Copy the Common Ground <li> below, put it at the top of the list and change the link, title and icon.
    Older experiments live in test/ and are listed in the "test" window below.
  -->
  <ul class="desktop">
    <li>
      <a class="icon" href="26-10-22-Common-Ground/" title="A shared map where humans and bots write side by side; human writing makes the machine text decay.">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <rect x="4" y="4" width="48" height="48" rx="6" fill="#1238c9" stroke="#4a6cf0"/>
          <path d="M12 34l6-8 5 4 7-10 5 6 4-3 5 11z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
          <rect x="12" y="40" width="10" height="3" fill="#fff"/>
          <rect x="24" y="40" width="6" height="3" fill="#fff" opacity=".7"/>
          <rect x="32" y="40" width="3" height="3" fill="#fff" opacity=".4"/>
          <rect x="37" y="39" width="3" height="5" fill="#5fe0c8"/>
        </svg>
        <span class="label">Common Ground</span>
      </a>
    </li>
    <li>
      <button class="icon" type="button" data-window="test" title="Earlier experiments.">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <path d="M4 14a3 3 0 0 1 3-3h14l5 5h23a3 3 0 0 1 3 3v26a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#3a6fe0"/>
          <path d="M4 21h48v24a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#5b8cf5"/>
        </svg>
        <span class="label">test</span>
      </button>
    </li>
  </ul>

  <section class="window" id="test" role="dialog" aria-labelledby="test-title" hidden>
    <div class="titlebar">
      <button class="close" type="button" aria-label="Close"></button>
      <span class="title" id="test-title">test</span>
    </div>
    <ul class="versions">
      <li>
        <a href="test/26-11-05-Flux-World/">
          <span class="v">·</span>
          <span>Flux World</span>
          <span class="date">2026-11-05</span>
        </a>
      </li>
      <li>
        <a href="test/26-10-15-bots-vs-humain/">
          <span class="v">v1</span>
          <span>Bots vs Humain</span>
          <span class="date">2026-10-15</span>
        </a>
      </li>
      <li>
        <a href="test/26-10-14-lantern/">
          <span class="v">·</span>
          <span>Lantern</span>
          <span class="date">2026-10-14</span>
        </a>
      </li>
      <li>
        <a href="test/26-10-08-soundroom/">
          <span class="v">·</span>
          <span>Shared Listening Room</span>
          <span class="date">2026-10-08</span>
        </a>
      </li>
    </ul>
    <div class="count"></div>
  </section>

<script>
// Folder icons open their window; the window drags by its title bar and closes with the button, Escape or a click elsewhere.
for (const icon of document.querySelectorAll('[data-window]')) {
  const win = document.getElementById(icon.dataset.window);
  const n = win.querySelectorAll('.versions li').length;
  win.querySelector('.count').textContent = n + (n === 1 ? ' item' : ' items');

  const close = () => { win.hidden = true; icon.classList.remove('open'); icon.focus(); };
  icon.addEventListener('click', () => {
    win.hidden = false;
    icon.classList.add('open');
    win.querySelector('.versions a').focus();
  });
  win.querySelector('.close').addEventListener('click', close);
  win.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  document.addEventListener('pointerdown', e => {
    if (win.hidden || win.contains(e.target) || icon.contains(e.target)) return;
    win.hidden = true;
    icon.classList.remove('open');
  });

  const bar = win.querySelector('.titlebar');
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.close')) return;
    const r = win.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    const move = e => {
      win.style.left = Math.max(0, Math.min(innerWidth - r.width, e.clientX - dx)) + 'px';
      win.style.top = Math.max(0, Math.min(innerHeight - 40, e.clientY - dy)) + 'px';
    };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
}
</script>
</body>
</html>
