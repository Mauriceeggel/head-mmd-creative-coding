<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creative Coding</title>
<meta name="description" content="Small web experiments built by vibe coding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a black desktop; projects are icons in a column grid from the top left.
   A project with several versions is a folder that opens a small window listing them. */
:root{
  --bg:#000;
  --ink:#e9e9ee;
  --muted:#8a8a96;
  --select:#2b4fd8;
  --window:#141418;
  --line:#34343c;
  --accent:#e9b75a;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font-mono); font-size:13px; -webkit-user-select:none; user-select:none}

.desktop{list-style:none; margin:0; padding:24px 16px; height:100vh;
  display:grid; grid-auto-flow:column; grid-template-rows:repeat(auto-fill, 112px); grid-auto-columns:104px; gap:8px; align-content:start}
@media (max-width:560px){
  .desktop{height:auto; grid-auto-flow:row; grid-template-rows:none; grid-template-columns:repeat(auto-fill, 104px); justify-content:center}
}
.icon{display:flex; flex-direction:column; align-items:center; gap:6px; width:104px; padding:6px 4px;
  color:inherit; text-decoration:none; background:none; border:0; font:inherit; cursor:pointer}
.icon svg{width:56px; height:56px; padding:4px; border-radius:6px; box-sizing:content-box}
.icon .label{max-width:100%; padding:1px 5px; border-radius:3px; text-align:center; line-height:1.3; overflow-wrap:anywhere}
.icon:hover svg{background:rgba(255,255,255,.08)}
.icon:focus-visible{outline:none}
.icon:focus-visible svg, .icon.open svg{background:rgba(255,255,255,.14)}
.icon:focus-visible .label, .icon.open .label{background:var(--select); color:#fff}

/* Window */
.window{position:fixed; top:96px; left:min(160px, calc(100vw - 336px)); width:min(320px, calc(100vw - 32px));
  background:var(--window); border:1px solid var(--line); border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:hidden}
.window[hidden]{display:none}
@media (max-width:560px){ .window{left:16px} }
.titlebar{display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); cursor:grab; touch-action:none}
.titlebar:active{cursor:grabbing}
.close{width:14px; height:14px; padding:0; border-radius:50%; border:0; background:#ff5f57; cursor:pointer; flex:none}
.close:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.title{flex:1; text-align:center; color:var(--muted); margin-right:24px}
.versions{list-style:none; margin:0; padding:6px}
.versions a{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:baseline; padding:8px 10px; border-radius:4px; color:inherit; text-decoration:none}
.versions a:hover, .versions a:focus-visible{background:var(--select); color:#fff; outline:none}
.versions .v{color:var(--accent)}
.versions .date{color:var(--muted); font-variant-numeric:tabular-nums}
.versions a:hover .v, .versions a:focus-visible .v,
.versions a:hover .date, .versions a:focus-visible .date{color:#fff}
.count{padding:6px 12px 8px; border-top:1px solid var(--line); color:var(--muted); font-size:11px}

/* Notepad: the process notes (process/readme.md), shown as a text file */
.window.notepad{top:56px; left:min(220px, calc(100vw - 696px)); width:min(680px, calc(100vw - 32px)); -webkit-user-select:text; user-select:text}
@media (max-width:560px){ .window.notepad{left:16px; top:16px} }
.notepad .titlebar{background:#1c1c22}
.note{max-height:calc(100vh - 160px); overflow:auto; padding:18px 22px 28px; line-height:1.6; font-size:13px; outline:none}
.note h1{font-size:15px; font-weight:500; color:var(--accent); margin:22px 0 8px}
.note h2{font-size:13px; font-weight:500; color:var(--accent); margin:18px 0 6px}
.note h1:first-child{margin-top:0}
.note h1::before{content:"# "; color:var(--muted)}
.note h2::before{content:"## "; color:var(--muted)}
.note p{margin:0 0 10px}
.note hr{border:0; border-top:1px dashed var(--line); margin:18px 0}
.note a{color:#8fb0ff}
.note a:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.note img{display:block; max-width:100%; height:auto; margin:10px 0; border:1px solid var(--line); border-radius:4px}
.note strong{color:#fff; font-weight:500}
.note .status{color:var(--muted)}
.notebar{display:flex; justify-content:space-between; padding:6px 12px 8px; border-top:1px solid var(--line); color:var(--muted); font-size:11px}
</style>
</head>

  <ul class="desktop">

 <section class="window notepad" id="process" role="dialog" aria-labelledby="process-title" hidden>

<script>
// Folder icons open their window; the window drags by its title bar and closes with the button, Escape or a click elsewhere.
for (const icon of document.querySelectorAll('[data-window]')) {
  const win = document.getElementById(icon.dataset.window);
  const count = win.querySelector('.count');
  if (count) {
    const n = win.querySelectorAll('.versions li').length;
    count.textContent = n + (n === 1 ? ' item' : ' items');
  }

  const close = () => { win.hidden = true; icon.classList.remove('open'); icon.focus(); };
  icon.addEventListener('click', () => {
    win.hidden = false;
    icon.classList.add('open');
    win.querySelector('.versions a, .note').focus();
    if (icon.dataset.window === 'process') loadNotes();
  });
  win.querySelector('.close').addEventListener('click', close);
  win.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  document.addEventListener('pointerdown', e => {
    if (win.hidden || win.contains(e.target) || icon.contains(e.target)) return;
    win.hidden = true;
    icon.classList.remove('open');
  });

  const bar = win.querySelector('.titlebar');
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.close')) return;
    const r = win.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    const move = e => {
      win.style.left = Math.max(0, Math.min(innerWidth - r.width, e.clientX - dx)) + 'px';
      win.style.top = Math.max(0, Math.min(innerHeight - 40, e.clientY - dy)) + 'px';
    };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
}

// The notepad reads process/readme.md, so it always shows the current notes.
// A tiny Markdown reader: headings, rules, images, links, bold, italics, paragraphs.
let notesLoaded = false;
async function loadNotes() {
  if (notesLoaded) return;
  const note = document.querySelector('#process .note');
  try {
    const res = await fetch('process/readme.md', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    note.innerHTML = renderMarkdown(md);
    const n = md.split('\n').length;
    document.querySelector('#process .lines').textContent = n + ' lines';
    notesLoaded = true;
  } catch (err) {
    note.innerHTML = '<p class="status">Could not open process/readme.md.</p>';
  }
}
function renderMarkdown(md) {
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // the readme points at /process/…, which is the site root, not this repo's page
  const fix = u => u.replace(/^\/process\//, 'process/');
  const inline = t => esc(t)
    .replace(/&lt;br\s*\/?&gt;/g, '<br>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => `<img src="${fix(u)}" alt="${a}" loading="lazy">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, a, u) => `<a href="${fix(u)}" target="_blank" rel="noopener">${a}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const out = [];
  let para = [];
  const flush = () => { if (para.length) out.push('<p>' + para.map(inline).reduce((a, l) => a + (/<br>$/.test(a) ? ' ' : '<br>') + l) + '</p>'); para = []; };
  for (const raw of md.split('\n')) {
    const line = raw.trim();
    let m;
    if (!line) flush();
    else if (/^(<hr\s*\/?>|-{3,}|\*{3,})$/.test(line)) { flush(); out.push('<hr>'); }
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); const h = Math.min(2, m[1].length); out.push(`<h${h}>${inline(m[2])}</h${h}>`); }
    else para.push(line);
  }
  flush();
  return out.join('');
}
</script>
