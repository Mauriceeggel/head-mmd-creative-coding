<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Common Ground — Presentation</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- the land grown from the texts, under everything -->
	<canvas id="land" aria-hidden="true"></canvas>
	<!-- bots write here, under the presentation text -->
	<div id="bots" aria-hidden="true"></div>
	<!-- the line between two people, then the people themselves -->
	<canvas id="fx" aria-hidden="true"></canvas>
	<div id="people" aria-hidden="true"></div>
	<!-- the presentation text, typed by the human cursor -->
	<main id="main"></main>
	<div id="count"></div>
	<div id="hint">← → to navigate · F fullscreen</div>
	<script src="script.js"></script>
</body>
</html>
