<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared Listening Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#e3e7ee; --surface:#f8f9fb; --ink:#16192a; --muted:#5a6075;
  --line:#c9cfdb; --accent:#8a5a00; --accent-soft:#f1e3c4; --dot-l:42%;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c19;--surface:#15182b;--ink:#e7e9f3;--muted:#9298b3;
    --line:#2a2f4a;--accent:#e9b75a;--accent-soft:#2b2516;--dot-l:66%;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c19;--surface:#15182b;--ink:#e7e9f3;--muted:#9298b3;
  --line:#2a2f4a;--accent:#e9b75a;--accent-soft:#2b2516;--dot-l:66%;color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-display)}
.stage{position:fixed;inset:0;touch-action:none;cursor:crosshair;outline:none}
.stage:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
canvas{display:block;width:100%;height:100%}
.gate{position:absolute;inset:0;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(2px);padding:16px}
.gate-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
.gate-inner input[type=text]{
  font-family:var(--font-mono);font-size:.92rem;padding:10px 20px;
  border:1px solid var(--line);border-radius:999px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  color:var(--ink);text-align:center;width:210px;backdrop-filter:blur(6px);
}
.gate-inner input[type=text]::placeholder{color:var(--muted)}
.gate-inner input[type=text]:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;
  justify-content:center;gap:10px;align-items:center;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.controls > *{pointer-events:auto}
button{font:inherit;font-weight:600;font-size:.92rem;border-radius:999px;padding:9px 18px;
  border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);
  color:var(--ink);cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:1.1rem;padding:14px 28px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.vol{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.78rem;color:var(--muted);
  background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;backdrop-filter:blur(6px)}
.vol input[type=range]{accent-color:var(--accent);width:80px}
.vol .val{min-width:1.4ch;text-align:right}
.vol select{font-family:var(--font-mono);font-size:.78rem;background:transparent;border:none;
  color:var(--muted);cursor:pointer;outline:none;padding:0 2px}
.vol select:focus{outline:1px solid var(--accent);border-radius:3px}
.vol select option{background:var(--surface);color:var(--ink)}
#status{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);padding:6px 14px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);
  border-radius:999px;backdrop-filter:blur(6px);pointer-events:none}
#status.live{color:var(--accent)}
</style>
</head>
<body>

<div class="stage" id="stage" tabindex="0" aria-label="Sound field. Move your listening point with the mouse or arrow keys. Press Space to send a signal.">
  <canvas id="cv"></canvas>
  <div class="gate" id="gate">
    <div class="gate-inner">
      <input type="text" id="nameInput" placeholder="Your name (optional)" maxlength="10" autocomplete="off" spellcheck="false">
      <button class="primary" id="enter">Enter the room</button>
    </div>
  </div>
</div>

<div class="controls">
  <button id="mute" aria-pressed="false">Mute</button>
  <button id="pulse">Send a signal</button>
  <button id="blind" aria-pressed="false">Blind mode</button>
  <label class="vol">
    Timbre&nbsp;<select id="timbre">
      <option value="tone" selected>Tone</option>
      <option value="sine">Sine</option>
      <option value="organ">Organ</option>
      <option value="strings">Strings</option>
      <option value="glass">Glass</option>
    </select>
  </label>
  <label class="vol" for="ghost-count">
    Empty shells&nbsp;<input type="range" id="ghost-count" min="0" max="10" value="0"><span class="val" id="ghost-val">0</span>
  </label>
  <label class="vol" for="vol">Volume&nbsp;<input type="range" id="vol" min="0" max="100" value="70"></label>
  <span id="status">connecting…</span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// ─── Firebase config ──────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBRBVKFWJQUuRbbEpFQQsUakYUcaiXB1VE",
  authDomain:        "vibe-724ae.firebaseapp.com",
  databaseURL:       "https://vibe-724ae-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "vibe-724ae",
  storageBucket:     "vibe-724ae.firebasestorage.app",
  messagingSenderId: "385206351842",
  appId:             "1:385206351842:web:aa47b2a23c8a32a26e6bbb",
};
// ─────────────────────────────────────────────────────────────────────────────

(() => {
  // ---------- Music ----------
  const SCALE     = [0,2,4,7,9];     // G pentatonic
  const BANDS     = 10;
  const BASE      = 196;             // G3 Hz
  const CONSONANT = new Set([0,5,7,3,4,9,8]);

  const bandOf = y => Math.max(0, Math.min(BANDS-1, Math.floor((1-y)*BANDS)));
  const semis  = b => SCALE[b%5] + 12*Math.floor(b/5);
  const freqOf = b => BASE * Math.pow(2, semis(b)/12);

  // ±50 cents detune from band center (more pronounced than before)
  function freqWithDetune(y) {
    const cont = (1-y)*BANDS;
    const band = Math.max(0, Math.min(BANDS-1, Math.floor(cont)));
    const dist = cont - band - 0.5;   // -0.5..+0.5
    return freqOf(band) * Math.pow(2, dist * 100 / 1200);
  }

  // ---------- Timbres ----------
  // Each entry: oscillator types, ratio & gain of 2nd osc, filter cutoff, LFO depth.
  // Only affects the user's own voice; others always use "tone".
  const TIMBRES = {
    tone:    { t1:'sine',     t2:'triangle', r2:2.004, g2:0.22, fcut:900,  lfod:0.25 },
    sine:    { t1:'sine',     t2:'sine',     r2:2.0,   g2:0.0,  fcut:2000, lfod:0.08 },
    organ:   { t1:'square',   t2:'square',   r2:3.0,   g2:0.15, fcut:700,  lfod:0.35 },
    strings: { t1:'sawtooth', t2:'sawtooth', r2:2.0,   g2:0.10, fcut:1400, lfod:0.18 },
    glass:   { t1:'sine',     t2:'sine',     r2:4.98,  g2:0.38, fcut:3000, lfod:0.12 },
  };
  let timbre = "tone";

  // ---------- State ----------
  const me     = { x:0.5, y:0.45, pulse:0, name:"" };
  const others = new Map();
  const ripples = [];
  let blind=false, ghostsOn=false, audioOn=false, muted=false;
  let loneSince=performance.now(), autoGhostDone=false;
  let initialSyncDone=false;
  let arpeggioNext=0, arpeggioIdx=0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const hash = s => { let h=2166136261; for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);} return(h>>>0); };
  const myHue = 38;

  // ---------- Audio ----------
  let ctx, master, wet, dry;

  function buildAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=4;
    master = ctx.createGain(); master.gain.value=vol();
    master.connect(comp).connect(ctx.destination);
    dry = ctx.createGain(); dry.gain.value=0.8; dry.connect(master);
    const conv = ctx.createConvolver();
    const len=ctx.sampleRate*2.8, ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    conv.buffer=ir;
    wet = ctx.createGain(); wet.gain.value=0;  // x-driven, starts dry
    wet.connect(conv).connect(master);
  }
  function vol() { return (document.getElementById("vol").value/100)*0.9; }

  function applyReverb() {
    if (!audioOn||!dry) return;
    const w = Math.abs(me.x-0.5)*2;
    dry.gain.setTargetAtTime(0.8*(1-w), ctx.currentTime, 0.15);
    wet.gain.setTargetAtTime(0.8*w,     ctx.currentTime, 0.15);
  }

  function makeVoice(freq, self) {
    const tm = TIMBRES[timbre] || TIMBRES.tone;
    const t  = ctx.currentTime;
    const o1 = ctx.createOscillator(); o1.type=tm.t1; o1.frequency.value=freq;
    const o2 = ctx.createOscillator(); o2.type=tm.t2; o2.frequency.value=freq*tm.r2;
    const g2 = ctx.createGain(); g2.gain.value=self ? tm.g2*0.55 : tm.g2;
    const f  = ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=tm.fcut; f.Q.value=0.6;
    const trem = ctx.createGain(); trem.gain.value=0.75;
    const lfo  = ctx.createOscillator(); lfo.frequency.value=0.12+Math.random()*0.22;
    const lfoG = ctx.createGain(); lfoG.gain.value=tm.lfod;
    lfo.connect(lfoG).connect(trem.gain);
    const amp = ctx.createGain(); amp.gain.value=0;
    const pan = ctx.createStereoPanner();
    o1.connect(f); o2.connect(g2).connect(f);
    f.connect(trem).connect(amp).connect(pan);
    pan.connect(dry); pan.connect(wet);
    [o1,o2,lfo].forEach(o=>o.start(t));
    let cur=freq, curR=tm.r2;
    return {
      set(fr,gain,p,cut){
        const now=ctx.currentTime;
        if(fr!==cur){o1.frequency.setTargetAtTime(fr,now,0.09);o2.frequency.setTargetAtTime(fr*curR,now,0.09);cur=fr;}
        amp.gain.setTargetAtTime(gain,now,0.12);
        pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,p)),now,0.1);
        f.frequency.setTargetAtTime(cut,now,0.15);
      },
      stop(){
        const now=ctx.currentTime;
        amp.gain.setTargetAtTime(0,now,0.3);
        [o1,o2,lfo].forEach(o=>o.stop(now+1.6));
      }
    };
  }

  function bell(freq, gain, p) {
    if(!audioOn||muted) return;
    const t=ctx.currentTime;
    const pan=ctx.createStereoPanner(); pan.pan.value=Math.max(-1,Math.min(1,p));
    pan.connect(dry); pan.connect(wet);
    [[1,1,2.6],[2.76,0.4,1.4],[5.4,0.2,0.7]].forEach(([m,a,dec])=>{
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.value=freq*2*m;
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(gain*a,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
      o.connect(g).connect(pan); o.start(t); o.stop(t+dec+0.05);
    });
  }

  // 3-note ascending welcome melody when someone joins
  function joinMelody() {
    if(!audioOn||muted) return;
    const pool=[...Array(BANDS).keys()];
    const picked=[];
    for(let i=0;i<3;i++){const idx=Math.floor(Math.random()*pool.length);picked.push(pool.splice(idx,1)[0]);}
    picked.sort((a,b)=>a-b);
    picked.forEach((band,i)=>setTimeout(()=>{ if(audioOn) bell(freqOf(band),0.08,(Math.random()-0.5)*0.5); },i*210));
  }

  // Proximity arpeggio — plays when other presences are close
  function maybeArpeggio(now) {
    if(!audioOn||muted) return;
    const nearBands=[];
    let closestD=1;
    for(const o of others.values()){
      const d=Math.hypot((o.dx-me.x)*1.3, o.dy-me.y);
      if(d<0.35){ nearBands.push(bandOf(o.dy)); if(d<closestD) closestD=d; }
    }
    if(nearBands.length===0){ arpeggioIdx=0; return; }
    if(now<arpeggioNext) return;
    const allBands=[...new Set([bandOf(me.y),...nearBands])].sort((a,b)=>a-b);
    const band=allBands[arpeggioIdx%allBands.length];
    // Gentle slow volume oscillation (va et vient léger)
    const gain=0.03+0.018*Math.sin(now*0.0017);
    bell(freqOf(band), Math.max(0.012,gain), (me.x-0.5)*0.5);
    arpeggioIdx++;
    arpeggioNext=now+260+closestD*750+Math.random()*60;
  }

  let selfVoice=null;
  function listen(o){
    const dx=o.dx-me.x, dy=o.dy-me.y, d=Math.hypot(dx*1.4,dy);
    const near=Math.max(0,1-d/0.9);
    const gain=(0.018+0.2*near*near)*(o.idle?0.4:1);
    return{d,gain,pan:dx*1.8,cut:380+4200*near*near};
  }

  // ---------- Simulated presences — grey, named "empty shell N" ----------
  const ghostSeeds=Array.from({length:10},(_,i)=>({id:`g${i+1}`,name:`empty shell ${i+1}`}));

  function setGhosts(count) {
    ghostsOn=count>0;
    for(let i=0;i<ghostSeeds.length;i++){
      const g=ghostSeeds[i];
      if(i<count){
        if(!others.has(g.id)){
          others.set(g.id,{
            x:.2+.3*(i%3), y:.3+.2*Math.floor(i/3),
            dx:.2+.3*(i%3),dy:.3+.2*Math.floor(i/3),
            pulse:0,hue:0,ghost:true,name:g.name,
            ph:Math.random()*10, nextPulse:performance.now()+3000+Math.random()*6000
          });
        }
      } else {
        const o=others.get(g.id);
        if(o){o.voice&&o.voice.stop();others.delete(g.id);}
      }
    }
  }

  function moveGhosts(now){
    const t=now/1000;
    for(const o of others.values()){
      if(!o.ghost) continue;
      const k=o.ph;
      o.x=0.5+0.38*Math.sin(t*0.07+k)*Math.cos(t*0.031+k*2);
      o.y=0.5+0.36*Math.sin(t*0.053+k*3);
      const near=Math.hypot(o.x-me.x,o.y-me.y)<0.25;
      if(now>o.nextPulse){o.pulse++;o.nextPulse=now+(near?2500:7000)+Math.random()*6000;}
    }
  }

  // ---------- Peers ----------
  function validNum(v){return typeof v==="number"&&isFinite(v);}
  function syncPeers(peers){
    const seen=new Set();
    for(const p of peers){
      if(p.sameTab) continue;
      const pr=p.presence||{};
      if(!validNum(pr.x)||!validNum(pr.y)) continue;
      seen.add(p.peer);
      let o=others.get(p.peer);
      const x=Math.max(0,Math.min(1,pr.x)), y=Math.max(0,Math.min(1,pr.y));
      const pulse=validNum(pr.pulse)?pr.pulse:0;
      if(!o){
        o={x,y,dx:x,dy:y,pulse,hue:hash(p.peer)%360,ghost:false,name:pr.name||""};
        others.set(p.peer,o);
        if(initialSyncDone) joinMelody();
      } else {
        if(pulse>o.pulse){o.pulse=pulse;firePulse(o);}
        o.x=x;o.y=y;o.name=pr.name||"";
      }
      o.idle=Date.now()-p.updatedAt>90000;
    }
    for(const[k,o]of others){if(!o.ghost&&!seen.has(k)){o.voice&&o.voice.stop();others.delete(k);}}
    initialSyncDone=true;
  }
  function realCount(){let n=0;for(const o of others.values())if(!o.ghost)n++;return n;}

  // ---------- Firebase ----------
  const MY_PEER_ID=Math.random().toString(36).slice(2,9)+Date.now().toString(36);
  const ROOM="soundroom-v1";
  let db=null, pushTimer=null;
  const statusEl=document.getElementById("status");

  function pushPresence(){
    if(!db) return;
    clearTimeout(pushTimer);
    pushTimer=setTimeout(()=>{
      db.ref(`${ROOM}/peers/${MY_PEER_ID}`).set({
        x:+me.x.toFixed(4),y:+me.y.toFixed(4),
        pulse:me.pulse,name:me.name||"",
        t:firebase.database.ServerValue.TIMESTAMP
      }).catch(()=>{});
    },80);
  }

  function connect(){
    const cfg=FIREBASE_CONFIG;
    const ok=cfg.apiKey&&!cfg.apiKey.includes("XXXXXXX")&&cfg.databaseURL&&!cfg.databaseURL.includes("XXXXX");
    if(!ok){statusEl.textContent="local only — configure Firebase to play online";return;}
    try{
      const app=firebase.initializeApp(cfg);
      db=firebase.database(app);
      db.ref(".info/connected").on("value",snap=>{if(!snap.val())statusEl.textContent="reconnecting…";});
      db.ref(`${ROOM}/peers/${MY_PEER_ID}`).onDisconnect().remove();
      db.ref(`${ROOM}/peers`).on("value",snap=>{
        const data=snap.val()||{};
        const peers=Object.entries(data)
          .filter(([id])=>id!==MY_PEER_ID)
          .map(([peer,pr])=>({peer,presence:{x:pr.x,y:pr.y,pulse:pr.pulse,name:pr.name||""},sameTab:false,updatedAt:pr.t||Date.now()}));
        syncPeers(peers);
        const n=peers.length;
        statusEl.textContent=n===0?"alone in the room":`${n+1} in the room`;
        statusEl.className=n>0?"live":"";
      },err=>{statusEl.textContent="connection error";console.error(err);});
      pushPresence();
    }catch(e){db=null;statusEl.textContent="Firebase init failed";console.error(e.message);}
  }

  window.addEventListener("pagehide",()=>{if(db)db.ref(`${ROOM}/peers/${MY_PEER_ID}`).remove().catch(()=>{});});

  // ---------- Gestures ----------
  const stage=document.getElementById("stage");
  function moveTo(x,y){
    me.x=Math.max(0.01,Math.min(0.99,x)); me.y=Math.max(0.01,Math.min(0.99,y));
    applyReverb(); pushPresence();
  }
  function firePulse(o){
    ripples.push({x:o.dx,y:o.dy,t:performance.now(),hue:o.hue,ghost:o.ghost,self:false});
    const l=listen(o);
    bell(freqWithDetune(o.dy),Math.max(0.05,l.gain*1.6),l.pan);
  }
  function myPulse(){
    me.pulse++; pushPresence();
    ripples.push({x:me.x,y:me.y,t:performance.now(),hue:myHue,ghost:false,self:true});
    bell(freqWithDetune(me.y),0.22,0);
  }

  let down=null;
  stage.addEventListener("pointerdown",e=>{
    if(e.target.closest(".gate")) return;
    stage.setPointerCapture(e.pointerId);
    const r=stage.getBoundingClientRect();
    down={x:e.clientX,y:e.clientY,t:performance.now()};
    moveTo((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
  });
  stage.addEventListener("pointermove",e=>{
    if(e.pointerType==="mouse"||down){
      const r=stage.getBoundingClientRect();
      moveTo((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
    }
  });
  stage.addEventListener("pointerup",e=>{
    if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8&&performance.now()-down.t<350)myPulse();
    down=null;
  });
  stage.addEventListener("pointercancel",()=>{down=null;});
  stage.addEventListener("keydown",e=>{
    const s=0.03;
    if(e.key==="ArrowLeft")moveTo(me.x-s,me.y);
    else if(e.key==="ArrowRight")moveTo(me.x+s,me.y);
    else if(e.key==="ArrowUp")moveTo(me.x,me.y-1/BANDS);
    else if(e.key==="ArrowDown")moveTo(me.x,me.y+1/BANDS);
    else if(e.key===" "||e.key==="Enter")myPulse();
    else return;
    e.preventDefault();
  });

  document.getElementById("nameInput").addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();document.getElementById("enter").click();}
  });
  document.getElementById("enter").addEventListener("click",startAudio);
  function startAudio(){
    me.name=(document.getElementById("nameInput").value||"").trim().slice(0,10);
    if(!ctx) buildAudio();
    ctx.resume(); audioOn=true; muted=false;
    master.gain.setTargetAtTime(vol(),ctx.currentTime,0.1);
    applyReverb();
    document.getElementById("gate").hidden=true;
    document.getElementById("mute").setAttribute("aria-pressed","false");
    document.getElementById("mute").textContent="Mute";
    stage.focus({preventScroll:true});
    pushPresence();
  }
  document.getElementById("mute").addEventListener("click",()=>{
    if(!audioOn){startAudio();return;}
    muted=!muted;
    master.gain.setTargetAtTime(muted?0:vol(),ctx.currentTime,0.1);
    const b=document.getElementById("mute");
    b.setAttribute("aria-pressed",String(muted));
    b.textContent=muted?"Unmute":"Mute";
  });
  document.getElementById("vol").addEventListener("input",()=>{if(master&&!muted)master.gain.setTargetAtTime(vol(),ctx.currentTime,0.05);});
  document.getElementById("pulse").addEventListener("click",()=>{if(!audioOn)startAudio();myPulse();});
  document.getElementById("blind").addEventListener("click",e=>{blind=!blind;e.currentTarget.setAttribute("aria-pressed",String(blind));});
  document.getElementById("timbre").addEventListener("change",e=>{
    timbre=e.target.value;
    // Recreate all local voices so the new timbre applies to every presence
    if(selfVoice){selfVoice.stop();selfVoice=null;}
    for(const o of others.values()){if(o.voice){o.voice.stop();o.voice=null;}}
  });
  document.getElementById("ghost-count").addEventListener("input",e=>{
    autoGhostDone=true;
    const n=parseInt(e.target.value);
    const prev=[...others.values()].filter(o=>o.ghost).length;
    document.getElementById("ghost-val").textContent=n;
    setGhosts(n);
    if(n>prev) joinMelody();
  });

  // ---------- Drawing ----------
  const cv=document.getElementById("cv"), g=cv.getContext("2d");
  let W=0,H=0,dpr=1,tok={};
  function readTokens(){
    const cs=getComputedStyle(document.documentElement);
    tok={ink:cs.getPropertyValue("--ink").trim(),muted:cs.getPropertyValue("--muted").trim(),
         line:cs.getPropertyValue("--line").trim(),accent:cs.getPropertyValue("--accent").trim(),
         L:cs.getPropertyValue("--dot-l").trim()||"55%"};
  }
  function resize(){
    const r=stage.getBoundingClientRect();
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=r.width;H=r.height;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    g.setTransform(dpr,0,0,dpr,0,0);
  }
  new ResizeObserver(resize).observe(stage);
  readTokens();setInterval(readTokens,1000);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readTokens);
  new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

  const col     = (h,a=1) => `hsla(${h} 70% ${tok.L} / ${a})`;
  const ghostCol= (a=1)   => `hsla(220 12% ${tok.L} / ${a})`;  // grey for empty shells
  const LABEL_FONT = `400 11px "JetBrains Mono",ui-monospace,monospace`;

  function draw(now){
    g.clearRect(0,0,W,H);

    // Staff lines — always crisp, no blur
    g.filter="none";
    const myBand=bandOf(me.y);
    for(let b=0;b<BANDS;b++){
      const y=(1-(b+0.5)/BANDS)*H;
      g.strokeStyle=b===myBand?tok.accent:tok.line;
      g.globalAlpha=b===myBand?0.6:0.55;
      g.lineWidth=b===myBand?1.5:1;
      g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();
    }
    g.globalAlpha=1;

    // Everything below gets blurred based on x (reverb visual cue)
    const blurPx=Math.abs(me.x-0.5)*2*7;  // max 7px at edges
    if(blurPx>0.4) g.filter=`blur(${blurPx.toFixed(1)}px)`;

    // Ripples
    for(let i=ripples.length-1;i>=0;i--){
      const r=ripples[i], age=(now-r.t)/2200;
      if(age>1){ripples.splice(i,1);continue;}
      if(blind&&!r.self) continue;
      const rad=10+age*Math.min(W,H)*0.55;
      g.strokeStyle=r.self?tok.accent:(r.ghost?ghostCol(1):col(r.hue,1));
      g.globalAlpha=(1-age)*0.8; g.lineWidth=2;
      g.beginPath();g.arc(r.x*W,r.y*H,rad,0,Math.PI*2);g.stroke();
      if(!reduced){g.globalAlpha=(1-age)*0.35;g.beginPath();g.arc(r.x*W,r.y*H,rad*0.6,0,Math.PI*2);g.stroke();}
    }
    g.globalAlpha=1;

    if(!blind){
      // Listening links
      for(const o of others.values()){
        const l=listen(o);
        if(l.d>=0.45) continue;
        const cons=CONSONANT.has(Math.abs(semis(bandOf(o.dy))-semis(myBand))%12);
        g.strokeStyle=o.ghost?ghostCol(0.5):(cons?tok.accent:tok.muted);
        g.globalAlpha=(1-l.d/0.45)*0.9; g.lineWidth=1;
        g.setLineDash(cons?[]:[3,4]);
        g.beginPath();g.moveTo(me.x*W,me.y*H);g.lineTo(o.dx*W,o.dy*H);g.stroke();
        g.setLineDash([]);
      }
      g.globalAlpha=1;

      // Presences
      for(const o of others.values()){
        const l=listen(o), x=o.dx*W, y=o.dy*H;
        const breath=reduced?0:Math.sin(now/900+o.hue)*2;
        const isGhost=o.ghost;
        g.globalAlpha=o.idle?0.4:1;
        // Halo
        g.fillStyle=isGhost?ghostCol(0.13):col(o.hue,0.18);
        g.beginPath();g.arc(x,y,18+breath+l.gain*40,0,Math.PI*2);g.fill();
        // Dot
        g.fillStyle=isGhost?ghostCol(0.8):col(o.hue,1);
        g.beginPath();g.arc(x,y,6,0,Math.PI*2);g.fill();
        // Ghost dashed ring
        if(isGhost){
          g.strokeStyle=ghostCol(0.55);g.setLineDash([2,3]);g.lineWidth=1;
          g.beginPath();g.arc(x,y,11,0,Math.PI*2);g.stroke();g.setLineDash([]);
        }
        // Name label
        if(o.name){
          g.globalAlpha=o.idle?0.35:(isGhost?0.5:0.85);
          g.font=LABEL_FONT;
          g.fillStyle=isGhost?ghostCol(1):col(o.hue,1);
          g.fillText(o.name,x+10,y-10);
        }
      }
      g.globalAlpha=1;
    }

    // Self dot (blurred at edges too)
    const mx=me.x*W, my=me.y*H, br=reduced?0:Math.sin(now/700)*2;
    g.strokeStyle=tok.accent; g.lineWidth=1.5;
    g.beginPath();g.arc(mx,my,16+br,0,Math.PI*2);g.stroke();
    g.fillStyle=tok.accent;
    g.beginPath();g.arc(mx,my,6,0,Math.PI*2);g.fill();
    if(me.name){
      g.font=LABEL_FONT; g.fillStyle=tok.accent; g.globalAlpha=0.9;
      g.fillText(me.name,mx+10,my-10); g.globalAlpha=1;
    }

    g.filter="none";  // always reset
  }

  // ---------- Loop ----------
  function frame(now){
    if(ghostsOn) moveGhosts(now);
    for(const o of others.values()){
      o.dx+=(o.x-o.dx)*0.18; o.dy+=(o.y-o.dy)*0.18;
      if(o.ghost&&o.lastPulse!==o.pulse){if(o.lastPulse!==undefined)firePulse(o);o.lastPulse=o.pulse;}
    }
    if(audioOn){
      if(!selfVoice) selfVoice=makeVoice(freqWithDetune(me.y),true);
      selfVoice.set(freqWithDetune(me.y),0.07,(me.x-0.5)*0.4,1600);
      for(const o of others.values()){
        if(!o.voice) o.voice=makeVoice(freqWithDetune(o.dy),false);
        const l=listen(o);
        o.voice.set(freqWithDetune(o.dy),l.gain,l.pan,l.cut);
      }
      maybeArpeggio(now);
    }
    draw(now);
    if(realCount()>0) loneSince=now;
    if(!autoGhostDone&&!ghostsOn&&now-loneSince>5000){
      autoGhostDone=true;
      const slider=document.getElementById("ghost-count");
      slider.value=3; document.getElementById("ghost-val").textContent=3;
      setGhosts(3); joinMelody();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  connect();
})();
</script>
</body>
</html>
